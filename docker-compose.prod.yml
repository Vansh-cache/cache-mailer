# Production / security-testing stack. Create .env.production first:
#   node scripts/init-production-env.mjs <domain> <acme-email>
# then:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Only Caddy publishes ports; MySQL and the Node services stay on the internal network.
name: cachemailer

x-app: &app
  image: cachemailer-app:latest
  build: .
  pull_policy: build
  env_file: .env.production
  environment:
    DATABASE_URL: mysql://mailer:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/bulk_mailer
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bulk_mailer
      MYSQL_USER: mailer
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "dist/index.js"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  tracking:
    <<: *app
    command: ["node", "dist/tracking.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      tracking:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  mysql:
  uploads:
  backups:
  caddy_data:
  caddy_config:
